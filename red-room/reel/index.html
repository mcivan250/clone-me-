<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="stylesheet" href="assets/fonts/fonts.css" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #05070a;
      }

      :root {
        --red: #e00d2e;
        --bone: #f4ebe8;
        --bone-2: #c5b0b2;
        --cold: #8ea2b4;
        --display: "Bodoni Moda", Didot, "Times New Roman", serif;
        --util: "Outfit", "Helvetica Neue", Arial, sans-serif;
      }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070a;
        font-family: var(--util);
      }

      .layer { position: absolute; inset: 0; }

      /* ============ ACT ONE: the ordinary side ============ */

      .cold-wash {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 60% 50% at 50% 42%, rgba(120,145,168,0.18), transparent 70%),
          linear-gradient(180deg, #080b0f 0%, #0b1015 55%, #06080b 100%);
      }

      /* a dull strip light — the world before the room */
      .cold-door {
        position: absolute;
        left: 50%;
        top: 430px;
        width: 300px;
        height: 620px;
        margin-left: -150px;
        background: linear-gradient(180deg,
          rgba(196,214,228,0.30) 0%,
          rgba(150,172,190,0.20) 45%,
          rgba(90,108,124,0.08) 100%);
        filter: blur(3px);
        -webkit-mask-image:
          linear-gradient(180deg, transparent 0%, #000 10%, #000 74%, transparent 100%),
          linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
        mask-image:
          linear-gradient(180deg, transparent 0%, #000 10%, #000 74%, transparent 100%),
          linear-gradient(90deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }

      .cold-label {
        position: absolute;
        left: 0;
        top: 1190px;
        width: 100%;
        text-align: center;
        font-size: 30px;
        font-weight: 500;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        text-transform: uppercase;
        color: var(--cold);
      }

      /* ============ THE CUT ============ */

      .flash { position: absolute; inset: 0; background: #fff5f3; opacity: 0; }

      /* ============ ACT TWO: the red room ============ */

      .bloom {
        position: absolute;
        left: 50%;
        top: 120px;
        width: 1080px;
        height: 1300px;
        margin-left: -540px;
        filter: blur(92px);
        background: radial-gradient(ellipse 46% 48% at 50% 48%,
          rgba(255,74,92,0.86), rgba(196,10,38,0.32) 54%, transparent 76%);
      }

      .door {
        position: absolute;
        left: 50%;
        top: 230px;
        width: 420px;
        height: 1000px;
        margin-left: -210px;
        background: linear-gradient(180deg,
          rgba(255,228,224,0.97) 0%,
          rgba(255,152,157,0.94) 22%,
          rgba(240,44,74,0.86) 52%,
          rgba(158,10,32,0.55) 80%,
          rgba(96,5,20,0.16) 100%);
        -webkit-mask-image:
          linear-gradient(180deg, transparent 0%, #000 9%, #000 68%, transparent 100%),
          linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
        mask-image:
          linear-gradient(180deg, transparent 0%, #000 9%, #000 68%, transparent 100%),
          linear-gradient(90deg, transparent 0%, #000 14%, #000 86%, transparent 100%);
        -webkit-mask-composite: source-in;
        mask-composite: intersect;
      }

      .core {
        position: absolute;
        left: 50%;
        top: 258px;
        width: 224px;
        height: 750px;
        margin-left: -112px;
        filter: blur(34px);
        background: linear-gradient(180deg,
          rgba(255,242,240,0.94) 0%,
          rgba(255,178,180,0.72) 34%,
          rgba(246,60,88,0.34) 72%,
          transparent 100%);
      }

      .pool {
        position: absolute;
        left: 50%;
        top: 1130px;
        width: 800px;
        height: 280px;
        margin-left: -400px;
        filter: blur(48px);
        background: radial-gradient(ellipse 50% 50% at 50% 50%,
          rgba(255,112,126,0.80), rgba(190,10,36,0.30) 56%, transparent 78%);
      }

      .shafts {
        position: absolute;
        left: 50%;
        top: 1060px;
        width: 1080px;
        height: 500px;
        margin-left: -540px;
        filter: blur(28px);
        mix-blend-mode: screen;
        -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 92%);
        mask-image: linear-gradient(180deg, #000 0%, transparent 92%);
      }

      /* strobe bars — the club light, pulsed rather than continuous */
      .bars {
        position: absolute;
        inset: 0;
        mix-blend-mode: screen;
        opacity: 0;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 72% 56% at 50% 40%, transparent 42%, rgba(5,3,5,0.56) 76%, rgba(5,3,5,0.95) 100%),
          linear-gradient(180deg, rgba(5,3,5,0.88) 0%, transparent 15%, transparent 60%, rgba(5,3,5,0.86) 80%, rgba(5,3,5,0.98) 93%);
      }

      .grain { position: absolute; inset: 0; opacity: 0.15; mix-blend-mode: overlay; }

      /* ============ type ============ */

      .venue {
        position: absolute;
        top: 148px;
        left: 0;
        width: 100%;
        text-align: center;
        font-size: 26px;
        font-weight: 600;
        letter-spacing: 0.54em;
        text-indent: 0.54em;
        text-transform: uppercase;
        color: var(--bone);
        text-shadow: 0 2px 22px rgba(5,3,5,0.95);
      }

      /* the tagline, one word per beat */
      .kinetic {
        position: absolute;
        left: 0;
        top: 548px;
        z-index: 3;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }

      .kw { overflow: hidden; padding: 0 8px; }

      .kw b {
        display: block;
        font-family: var(--util);
        font-weight: 700;
        font-size: 172px;
        line-height: 1.02;
        letter-spacing: -0.025em;
        text-transform: uppercase;
        color: #fffaf9;
        text-shadow: 0 0 60px rgba(255,70,90,0.55);
      }

      .kw.mid b { font-size: 150px; }

      .foot {
        position: absolute;
        left: 58px;
        right: 58px;
        bottom: 150px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .wordmark-wrap { overflow: hidden; }

      .wordmark {
        font-family: var(--display);
        font-weight: 900;
        font-size: 190px;
        line-height: 0.79;
        letter-spacing: -0.035em;
        color: #fffbfa;
        text-shadow: 0 0 52px rgba(255,66,88,0.58), 0 0 155px rgba(224,13,46,0.46);
      }

      .wordmark span { display: block; }

      .hairline {
        width: 100%;
        height: 1px;
        margin: 42px 0 34px;
        background: linear-gradient(90deg, transparent, rgba(244,235,232,0.42), transparent);
        transform: scaleX(0);
      }

      .date {
        font-size: 37px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        background: var(--red);
        color: #0a0305;
        padding: 18px 38px;
        white-space: nowrap;
      }

      .kicker {
        font-size: 21px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-indent: 0.3em;
        text-transform: uppercase;
        color: var(--bone-2);
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1080"
      data-height="1920"
    >
      <svg width="0" height="0" style="position: absolute">
        <defs>
          <filter id="grainFilter">
            <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" />
            <feColorMatrix type="saturate" values="0" />
          </filter>
        </defs>
      </svg>

      <!-- ACT ONE -->
      <div class="layer clip" id="cold" data-start="0" data-duration="20" data-track-index="0">
        <div class="cold-wash"></div>
        <div class="cold-door" id="coldDoor"></div>
        <p class="cold-label" id="coldLabel" data-layout-allow-occlusion>This side</p>
      </div>

      <!-- ACT TWO -->
      <div class="layer clip" id="hot" data-start="0" data-duration="20" data-track-index="1">
        <div class="bloom" id="bloom" data-layout-allow-overflow></div>
        <div class="door" id="door"></div>
        <div class="core" id="core"></div>
        <div class="pool" id="pool"></div>
        <svg class="shafts" id="shafts" viewBox="0 0 1080 500" preserveAspectRatio="none">
          <polygon points="320,0 760,0 1030,500 50,500" fill="rgba(255,84,100,0.46)" />
          <polygon points="396,0 684,0 862,500 218,500" fill="rgba(255,146,152,0.38)" />
          <polygon points="464,0 616,0 676,500 404,500" fill="rgba(255,206,204,0.30)" />
        </svg>
      </div>

      <svg class="bars clip" id="bars" viewBox="0 0 1080 1920" preserveAspectRatio="none"
           data-start="0" data-duration="20" data-track-index="2">
        <rect x="84"  y="0" width="52" height="1920" fill="rgba(255,96,112,0.30)" />
        <rect x="286" y="0" width="34" height="1920" fill="rgba(255,140,150,0.22)" />
        <rect x="742" y="0" width="34" height="1920" fill="rgba(255,140,150,0.22)" />
        <rect x="934" y="0" width="52" height="1920" fill="rgba(255,96,112,0.30)" />
      </svg>

      <div class="vignette clip" id="vignette" data-start="0" data-duration="20" data-track-index="3"></div>

      <svg class="grain clip" id="grain" data-start="0" data-duration="20" data-track-index="4">
        <rect width="100%" height="100%" filter="url(#grainFilter)" />
      </svg>

      <div class="flash clip" id="flash" data-start="0" data-duration="20" data-track-index="5"></div>

      <p class="venue clip" id="venue" data-start="0" data-duration="20" data-track-index="6">Club Guvnor</p>

      <div class="kinetic clip" id="kinetic" data-start="0" data-duration="20" data-track-index="7">
        <div class="kw" data-layout-allow-overflow><b id="kw1" data-layout-allow-occlusion>Your</b></div>
        <div class="kw mid" data-layout-allow-overflow><b id="kw2" data-layout-allow-occlusion>Another</b></div>
        <div class="kw" data-layout-allow-overflow><b id="kw3" data-layout-allow-occlusion>Side</b></div>
      </div>

      <div class="foot">
        <div class="wordmark-wrap clip" id="wmWrap" data-layout-allow-overflow data-start="0" data-duration="20" data-track-index="8">
          <h1 class="wordmark" id="wordmark" data-layout-allow-occlusion><span>RED</span><span>ROOM</span></h1>
        </div>
        <div class="hairline clip" id="hairline" data-start="0" data-duration="20" data-track-index="9"></div>
        <span class="date clip" id="date" data-start="0" data-duration="20" data-track-index="10">
          Fri 23 Oct &middot; 10pm till late
        </span>
        <p class="kicker clip" id="kicker" data-start="0" data-duration="20" data-track-index="11">
          4th Friday every month
        </p>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Every tween is authored fromTo with explicit values, or set() at an exact
      // position, so any frame can be seeked directly. No randomness, no repeat
      // counters, no time-of-day.

      // Resting state at t=0: the ordinary side is up, the room and all type are down.
      tl.set("#cold",     { opacity: 1 }, 0);
      tl.set("#hot",      { opacity: 0 }, 0);
      tl.set("#bars",     { opacity: 0 }, 0);
      tl.set("#flash",    { opacity: 0 }, 0);
      tl.set("#venue",    { opacity: 0 }, 0);
      tl.set("#kinetic",  { opacity: 1 }, 0);
      tl.set("#wmWrap",   { opacity: 0 }, 0);
      tl.set("#hairline", { opacity: 0, scaleX: 0 }, 0);
      tl.set("#date",     { opacity: 0 }, 0);
      tl.set("#kicker",   { opacity: 0 }, 0);
      tl.set(["#kw1", "#kw2", "#kw3"], { yPercent: 112 }, 0);
      tl.set("#wordmark", { yPercent: 104 }, 0);

      // --- ACT ONE: the ordinary side. Dull, cold, and held just long enough to bore.
      tl.fromTo("#coldDoor",  { opacity: 0, scaleY: 0.96 },
                              { opacity: 1, scaleY: 1, duration: 1.1, ease: "power2.out" }, 0.25);
      tl.fromTo("#coldLabel", { opacity: 0, y: 14 },
                              { opacity: 1, y: 0, duration: 0.9, ease: "power2.out" }, 0.75);

      // --- THE CUT: two hard strobe frames, then the world swaps underneath them.
      tl.to("#flash", { opacity: 0.85, duration: 0.05, ease: "none" }, 2.05);
      tl.to("#flash", { opacity: 0,    duration: 0.06, ease: "none" }, 2.10);
      tl.to("#flash", { opacity: 1,    duration: 0.05, ease: "none" }, 2.22);
      tl.set("#cold", { opacity: 0 }, 2.26);   // the ordinary side is gone for good
      tl.set("#hot",  { opacity: 1 }, 2.26);
      tl.to("#flash", { opacity: 0,    duration: 0.30, ease: "power2.out" }, 2.27);

      // --- ACT TWO: the room floods. Door blasts open rather than easing.
      tl.fromTo("#door",   { scaleX: 0.14 }, { scaleX: 1, duration: 0.85, ease: "power4.out", immediateRender: false }, 2.26);
      tl.fromTo("#core",   { scaleX: 0.10, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 0.9, ease: "power4.out", immediateRender: false }, 2.26);
      tl.fromTo("#bloom",  { scale: 0.86, opacity: 0.35 }, { scale: 1, opacity: 1, duration: 1.4, ease: "power3.out", immediateRender: false }, 2.26);
      tl.fromTo("#pool",   { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "power2.out", immediateRender: false }, 2.5);
      tl.fromTo("#shafts", { opacity: 0 }, { opacity: 1, duration: 1.3, ease: "power2.out", immediateRender: false }, 2.6);
      tl.fromTo("#venue",  { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.9, ease: "power2.out", immediateRender: false }, 3.4);

      // strobe bars punch on the downbeats, never left running
      [[3.05, 0.5], [3.55, 0.34], [4.15, 0.42]].forEach(([t, amp]) => {
        tl.to("#bars", { opacity: amp, duration: 0.06, ease: "none" }, t);
        tl.to("#bars", { opacity: 0,   duration: 0.22, ease: "power2.out" }, t + 0.06);
      });

      // --- THE TAGLINE: one word per beat, slammed up behind a mask.
      tl.fromTo("#kw1", { yPercent: 112 }, { yPercent: 0, duration: 0.52, ease: "power4.out", immediateRender: false }, 5.2);
      tl.fromTo("#kw2", { yPercent: 112 }, { yPercent: 0, duration: 0.52, ease: "power4.out", immediateRender: false }, 5.92);
      tl.fromTo("#kw3", { yPercent: 112 }, { yPercent: 0, duration: 0.52, ease: "power4.out", immediateRender: false }, 6.64);

      // each slam kicks the bars
      [5.2, 5.92, 6.64].forEach((t) => {
        tl.to("#bars", { opacity: 0.44, duration: 0.05, ease: "none" }, t);
        tl.to("#bars", { opacity: 0,    duration: 0.26, ease: "power2.out" }, t + 0.05);
      });

      // hold the tagline, then clear it for the name
      tl.to("#kinetic", { opacity: 0, duration: 0.55, ease: "power2.in" }, 8.7);

      // --- THE NAME
      tl.fromTo("#wmWrap", { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none", immediateRender: false }, 9.3);
      tl.fromTo("#wordmark", { yPercent: 104 }, { yPercent: 0, duration: 1.0, ease: "power4.out", immediateRender: false }, 9.3);
      tl.to("#bars", { opacity: 0.5, duration: 0.05, ease: "none" }, 9.3);
      tl.to("#bars", { opacity: 0,   duration: 0.4,  ease: "power2.out" }, 9.35);

      // --- DETAILS
      tl.fromTo("#hairline", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.8, ease: "power2.inOut", immediateRender: false }, 11.4);
      tl.fromTo("#date",   { opacity: 0, y: 26, scale: 0.95 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "back.out(1.7)", immediateRender: false }, 12.2);
      tl.fromTo("#kicker", { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out", immediateRender: false }, 13.2);

      // --- END HOLD: slow push, with two flickers so it never goes dead.
      tl.fromTo("#bloom", { scale: 1 }, { scale: 1.08, duration: 5.6, ease: "sine.inOut", immediateRender: false }, 14.4);
      [16.2, 18.4].forEach((t) => {
        tl.to("#bars", { opacity: 0.3, duration: 0.05, ease: "none" }, t);
        tl.to("#bars", { opacity: 0,   duration: 0.3,  ease: "power2.out" }, t + 0.05);
      });

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
